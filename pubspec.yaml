name: inverto
description: "Seguimiento personal de fondos de inversión."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.13.4

dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  table_calendar: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/inverto-icon.png
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
